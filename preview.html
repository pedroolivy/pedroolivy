<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile preview</title>
<link rel="icon" href="data:,">
<style>
:root {
  --page: #ffffff;
  --text: #1f2328;
  --text-muted: #59636e;
  --link: #0969da;
  --border: #d1d9e0;
  --toolbar: #f6f8fa;
  --button-active: #1f2328;
  --button-active-text: #ffffff;
  --width: 846px;
  --gutter: 16px;
}
html[data-theme="dark"] {
  --page: #0d1117;
  --text: #f0f6fc;
  --text-muted: #9198a1;
  --link: #4493f8;
  --border: #3d444d;
  --toolbar: #151b23;
  --button-active: #f0f6fc;
  --button-active-text: #0d1117;
  color-scheme: dark;
}
html[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: calc(var(--toolbar-height, 48px) + 24px) var(--gutter) 48px;
  background: var(--page);
  color: var(--text);
  font: 14px/1.5 "Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
}

.toolbar {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 20px;
  padding: 8px var(--gutter);
  background: var(--toolbar);
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  line-height: 1.2;
}
.group { display: flex; align-items: center; gap: 6px; }
.label { color: var(--text-muted); }
.toolbar button {
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font: inherit;
  cursor: pointer;
}
.toolbar button:hover { border-color: var(--text-muted); }
.toolbar button[aria-pressed="true"] { background: var(--button-active); border-color: var(--button-active); color: var(--button-active-text); }
.toolbar button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.measure { margin-left: auto; color: var(--text-muted); font-variant-numeric: tabular-nums; }

.frame {
  width: calc(var(--width) + 50px);
  max-width: 100%;
  margin: 0 auto;
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: 6px;
}

.markdown-body { overflow-wrap: break-word; }
.markdown-body > :first-child { margin-top: 0 !important; }
.markdown-body > :last-child { margin-bottom: 0 !important; }
.markdown-body a { color: var(--link); text-decoration: none; }
.markdown-body a:hover { text-decoration: underline; }
.markdown-body img { max-width: 100%; box-sizing: content-box; }
</style>
</head>
<body>

<div class="toolbar" role="toolbar" aria-label="Preview controls">
  <div class="group" role="group" aria-label="Theme">
    <span class="label">Theme</span>
    <button type="button" data-theme="dark">Dark</button>
    <button type="button" data-theme="light">Light</button>
  </div>
  <div class="group" role="group" aria-label="Width">
    <span class="label">Width</span>
    <button type="button" data-width="846">Desktop 846</button>
    <button type="button" data-width="575">Tablet 575</button>
    <button type="button" data-width="308">Phone 308</button>
    <button type="button" data-width="293">Phone 293</button>
  </div>
  <button type="button" id="replay">Replay animation</button>
  <span class="measure" id="measure" aria-live="polite"></span>
</div>

<div class="frame">
<article class="markdown-body" id="readme">
<div align="center" lang="en">
<picture>
<source media="(prefers-color-scheme: dark)" srcset="assets/profile-dark.svg">
<img alt="Pedro S. Oliveira, software developer. A terrain model of the last 364 days of contributions, one ridge per day of the week, crossed by a red route that ends at today." src="assets/profile-light.svg" width="100%" align="top">
</picture>
</div>

<div align="center" lang="en">
<br>
<a href="https://www.linkedin.com/in/pedro-oliveira-286342184/"><picture><source media="(prefers-color-scheme: dark)" srcset="assets/contact-linkedin-dark.svg"><img alt="LinkedIn" src="assets/contact-linkedin-light.svg" width="40"></picture></a>&nbsp;&nbsp;
<a href="mailto:pedrooliveiradevs@gmail.com"><picture><source media="(prefers-color-scheme: dark)" srcset="assets/contact-email-dark.svg"><img alt="E-mail: pedrooliveiradevs@gmail.com" src="assets/contact-email-light.svg" width="40"></picture></a>&nbsp;&nbsp;
<a href="https://www.instagram.com/pedr.ooliveira/"><picture><source media="(prefers-color-scheme: dark)" srcset="assets/contact-instagram-dark.svg"><img alt="Instagram" src="assets/contact-instagram-light.svg" width="40"></picture></a>
</div>
</article>
</div>

<script>
const root = document.documentElement;
const toolbar = document.querySelector('.toolbar');
const article = document.getElementById('readme');
const measure = document.getElementById('measure');
const themeButtons = document.querySelectorAll('[data-theme]');
const widthButtons = document.querySelectorAll('[data-width]');
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

function applyTheme(theme) {
  root.dataset.theme = theme;
  article.querySelectorAll('source').forEach((source) => {
    source.media = theme === 'dark' ? 'all' : 'not all';
  });
  themeButtons.forEach((button) => button.setAttribute('aria-pressed', button.dataset.theme === theme));
}

function applyWidth(width) {
  root.style.setProperty('--width', width + 'px');
  widthButtons.forEach((button) => button.setAttribute('aria-pressed', button.dataset.width === String(width)));
}

function replayAnimation() {
  const stamp = Date.now();
  const withoutQuery = (address) => address.split('?')[0];
  article.querySelectorAll('source').forEach((source) => {
    source.srcset = withoutQuery(source.getAttribute('srcset')) + '?r=' + stamp;
  });
  article.querySelectorAll('img').forEach((image) => {
    image.src = withoutQuery(image.getAttribute('src')) + '?r=' + stamp;
  });
}

function updateMeasures() {
  root.style.setProperty('--toolbar-height', toolbar.offsetHeight + 'px');
  measure.textContent = 'Content width: ' + Math.round(article.getBoundingClientRect().width) + ' px';
}

let themeChosenByUser = false;
themeButtons.forEach((button) => button.addEventListener('click', () => {
  themeChosenByUser = true;
  applyTheme(button.dataset.theme);
}));
widthButtons.forEach((button) => button.addEventListener('click', () => applyWidth(Number(button.dataset.width))));
document.getElementById('replay').addEventListener('click', replayAnimation);

prefersDark.addEventListener('change', (event) => {
  if (!themeChosenByUser) applyTheme(event.matches ? 'dark' : 'light');
});

new ResizeObserver(updateMeasures).observe(article);
new ResizeObserver(updateMeasures).observe(toolbar);

applyTheme(prefersDark.matches ? 'dark' : 'light');
applyWidth(846);
updateMeasures();
</script>
</body>
</html>
